[package]
name = "termx-desktop"
description = "termx desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
# A distinct library name avoids an output file name clash with the binary on
# Windows.
name = "termx_desktop_lib"

[features]
# Test-only automation for the end-to-end suite in `e2e/`: see `src/e2e.rs`.
# Never part of a release: enabling it in a build without debug assertions,
# with a profile that inherits from `release` or without TERMX_ALLOW_E2E=1
# (set by `pnpm e2e:build`) is a compile error. See `build.rs`.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
# Shows the log folder in the file manager of the platform.
open = "5.4.5"
# Reads the Windows build number, which xterm.js needs to match the
# behaviour of the pseudo-console. Already a dependency of termx-core.
os_info = { version = "3.15.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.12.7", features = [] }
# Copy and paste in the terminal, and clipboard writes requested by programs
# (OSC 52), without depending on the clipboard support of each webview.
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
# Opens the links of the terminal in the system browser.
tauri-plugin-opener = "2.7.3"
# The WebDriver server the end-to-end suite drives the application through.
# Only compiled with the `e2e` feature.
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
termx-core = { workspace = true }

[dev-dependencies]
serde_json = "1.0.154"
# The mock runtime, to call the commands as the webview does without
# opening a window.
tauri = { version = "2.12.7", features = ["test"] }
tempfile = "3.27.0"

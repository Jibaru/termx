name: End-to-end

# Drives the real application (real webview, real xterm.js, real PTY) on the
# three platforms. See "End-to-end tests" in CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: How many times to run the suite, to measure flakiness
        type: number
        default: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit. GitHub's own `actions/*` use
# major version tags, as in CI.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  e2e:
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # https://v2.tauri.app/start/prerequisites/#linux, a display for the
      # window, since the runner has none, and ImageMagick to take a picture
      # of it.
      - name: Install Linux dependencies for Tauri and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            xauth \
            imagemagick

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The toolchain and its components come from rust-toolchain.toml.
      - name: Set up Rust
        run: rustup toolchain install

      # The build of the suite has its own features, so its own cache: the
      # dependencies are compiled once, then only the crates of termx.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The frontend, then a debug build of the application with the `e2e`
      # feature: once per platform, whatever the number of tests.
      - name: Build the application for the suite
        run: pnpm e2e:build

      # The code behind the `e2e` feature is not seen by the checks of CI,
      # which build without it. Once is enough: it is the same everywhere.
      - name: Check the test-only code of the application
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p termx-desktop --all-targets --features e2e,tauri/custom-protocol --locked -- -D warnings
          cargo test -p termx-desktop --features e2e,tauri/custom-protocol --locked --lib e2e::

      # A failed test is never run again: only starting the application is
      # (see e2e/src/app.ts), and every repeated start is reported below.
      - name: Run the end-to-end suite
        env:
          REPEAT: ${{ inputs.repeat || 1 }}
        run: |
          launcher=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            launcher=(xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24")
          fi
          failed=0
          for ((run = 1; run <= REPEAT; run++)); do
            echo "::group::Run $run of $REPEAT"
            if ! "${launcher[@]}" pnpm e2e; then
              failed=$((failed + 1))
              # Keep what this run left behind: the next one starts over.
              if [[ -d e2e/artifacts ]]; then
                mv e2e/artifacts "e2e/artifacts-failed-run-$run"
              fi
            fi
            echo "::endgroup::"
          done
          echo "Failed runs: $failed of $REPEAT" | tee -a "$GITHUB_STEP_SUMMARY"
          ((failed == 0))

      - name: Report the starts of the application that were repeated
        if: always()
        run: |
          shopt -s nullglob
          logs=(e2e/artifacts*/startup-retries.log)
          if ((${#logs[@]} == 0)); then
            echo "Repeated starts of the application: 0" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Repeated starts of the application: $(cat "${logs[@]}" | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
            cat "${logs[@]}"
          fi

      # The logs of the application, what the terminal showed and a
      # screenshot for every failed test.
      - name: Upload what the failed tests left behind
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: e2e/artifacts*/
          if-no-files-found: ignore
          retention-days: 14

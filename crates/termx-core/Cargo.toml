[package]
name = "termx-core"
description = "UI-independent core of the termx terminal emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
portable-pty = "0.9.0"
thiserror = "2.0.21"

# Used on Unix to wait on the PTY and a wake-up pipe at the same time, so the
# reader thread can always be stopped. Already part of the dependency tree
# through portable-pty.
[target.'cfg(unix)'.dependencies]
filedescriptor = "0.8.3"

# Child process driven by the PTY integration tests. It is a test fixture, not
# part of the library: Cargo only exposes the path of a binary to integration
# tests (`CARGO_BIN_EXE_*`) when the binary belongs to the same package.
[[bin]]
name = "termx-pty-test-helper"
path = "tests/helpers/pty_helper.rs"
test = false
doc = false
bench = false

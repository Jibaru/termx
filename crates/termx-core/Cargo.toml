[package]
name = "termx-core"
description = "UI-independent core of the termx terminal emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
portable-pty = "0.9.0"
thiserror = "2.0.21"

# Used on Unix to wait on the PTY and a wake-up pipe at the same time, so the
# reader thread can always be stopped. Already part of the dependency tree
# through portable-pty.
[target.'cfg(unix)'.dependencies]
filedescriptor = "0.8.3"
rlimit = "0.12"

# Lets a Windows test observe the raw console, to check what the PTY layer
# does with its start-up query.
[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9.0"

# Child process driven by the PTY integration tests. It is a test fixture
# declared as an example so that it is built by `cargo test` but never
# installed or shipped with the library.
[[example]]
name = "pty-test-helper"
path = "tests/helpers/pty_helper.rs"

name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit. GitHub's own `actions/*` use
# major version tags, as in CI.
permissions: {}

jobs:
  title:
    name: Conventional pull request title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Rules come from commitlint.config.mjs.
      - name: Check the commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  change-file:
    name: Change file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The full history is needed to compare against the base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the pull request adds a change file when it needs one
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          SKIP_LABEL_SET: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-change-file.sh

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.24.0

      - name: Validate the Knope configuration
        run: knope --validate

      # Fails when a change file is malformed or the versioned files disagree.
      - name: Dry-run the release
        if: hashFiles('.changeset/*.md') != ''
        run: knope prepare-release --dry-run

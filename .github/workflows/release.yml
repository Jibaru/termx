name: Release

# Cuts a release of termx. It only ever runs when someone starts it by hand
# from the Actions tab or with `gh workflow run release.yml`.
#
# 1. `prepare` compiles the change files in `.changeset/` into CHANGELOG.md,
#    bumps the version in every versioned file, and pushes that as one commit
#    to `main`.
# 2. `release` tags that commit `v<version>` and creates the GitHub Release
#    with the new CHANGELOG.md section as its notes.
#
# If an earlier run pushed the release commit but failed before tagging it,
# the next run skips step 1 and finishes that release.
#
# Third-party actions are pinned to a commit because these jobs can write to
# the repository. GitHub's own `actions/*` use major version tags, as in CI.
#
# See the "Changelog and commits" section of CONTRIBUTING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.1.0. Leave empty to derive it from the change files.
        required: false
        type: string
      dry-run:
        description: Only print what the release would change, without pushing, tagging or releasing.
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Prepare the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit to main
    outputs:
      # The commit to tag: an untagged release commit from an earlier run, or
      # the one pushed by this run.
      sha: ${{ steps.state.outputs.sha || steps.push.outputs.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Knope finds the previous release through the Git tags.
          fetch-depth: 0

      # Sets `mode` to `finish` when the current version was pushed but never
      # tagged, and to `prepare` otherwise. Fails when there is nothing to
      # release.
      - name: Check what there is to release
        id: state
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: .github/scripts/release-preflight.sh

      - name: Install Knope
        if: steps.state.outputs.mode == 'prepare'
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.24.0

      - name: Dry-run the release
        if: inputs.dry-run && steps.state.outputs.mode == 'prepare'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          args=(--dry-run)
          if [[ -n "$VERSION" ]]; then args+=(--override-version "$VERSION"); fi
          knope prepare-release "${args[@]}"

      - name: Configure Git
        if: ${{ !inputs.dry-run && steps.state.outputs.mode == 'prepare' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update the changelog and the versions
        if: ${{ !inputs.dry-run && steps.state.outputs.mode == 'prepare' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          args=(--verbose)
          if [[ -n "$VERSION" ]]; then args+=(--override-version "$VERSION"); fi
          knope prepare-release "${args[@]}"

      # The toolchain comes from rust-toolchain.toml.
      - name: Set up Rust
        if: ${{ !inputs.dry-run && steps.state.outputs.mode == 'prepare' }}
        run: rustup toolchain install

      # CI builds with `--locked`. Refuse to push a release commit whose
      # Cargo.lock no longer matches the manifests.
      - name: Check that Cargo.lock is in sync
        if: ${{ !inputs.dry-run && steps.state.outputs.mode == 'prepare' }}
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Push the release commit
        id: push
        if: ${{ !inputs.dry-run && steps.state.outputs.mode == 'prepare' }}
        run: |
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # HOOK: build the installers (later milestone, not implemented yet).
  #
  # Add a `build-installers` job here that `needs: prepare`, checks out
  # `needs.prepare.outputs.sha` on Linux, macOS and Windows, builds the bundles
  # (for example with tauri-apps/tauri-action) and uploads them with
  # actions/upload-artifact. Then:
  #
  # - make the `release` job below `needs: [prepare, build-installers]` and
  #   download the artifacts into `artifacts/` before `knope release`;
  # - set `assets = "artifacts/*"` under `[package]` in knope.toml. Knope then
  #   creates the release as a draft, uploads the installers, and publishes it.
  #
  # Keep it in this workflow: the tag is created with the default GITHUB_TOKEN,
  # which does not trigger other workflows.
  #
  # PRIVACY, REQUIRED: build the installers with remapped source paths, so
  # that backtraces in users' logs do not contain the paths of the build
  # machine. In the build step, before `tauri build`:
  #
  #   export CARGO_ENCODED_RUSTFLAGS="$(.github/scripts/release-rustflags.sh)"
  #
  # See .github/scripts/release-rustflags.sh and docs/logging.md.
  #
  # NO TEST AUTOMATION, REQUIRED: the cargo feature `e2e` embeds a WebDriver
  # server that anyone on the machine could drive (see "End-to-end tests" in
  # CONTRIBUTING.md). The build refuses it (apps/desktop/src-tauri/build.rs
  # and lib.rs; checked by .github/workflows/e2e.yml), so never set
  # TERMX_ALLOW_E2E or `--features e2e` here. As a last check, after the
  # build and before uploading, fail the job if a built binary contains the
  # strings `wdio` or `TAURI_WEBDRIVER_PORT`, for example:
  #
  #   if grep -a -l -E 'wdio|TAURI_WEBDRIVER_PORT' "$binary"; then exit 1; fi
  # ---------------------------------------------------------------------------

  release:
    name: Create the GitHub Release
    needs: prepare
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.24.0

      - name: Tag the commit and create the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: knope release --verbose

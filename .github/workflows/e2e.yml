name: End-to-end

# Drives the real application (real webview, real xterm.js, real PTY) on the
# three platforms. See "End-to-end tests" in CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: How many times to run the suite, to measure flakiness
        type: number
        default: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit. GitHub's own `actions/*` use
# major version tags, as in CI.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  e2e:
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # https://v2.tauri.app/start/prerequisites/#linux, a display for the
      # window, since the runner has none, and ImageMagick to take a picture
      # of it.
      - name: Install Linux dependencies for Tauri and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            xauth \
            imagemagick

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The toolchain and its components come from rust-toolchain.toml.
      - name: Set up Rust
        run: rustup toolchain install

      # The build of the suite has its own features, so its own cache: the
      # dependencies are compiled once, then only the crates of termx.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The frontend, then a debug build of the application with the `e2e`
      # feature: once per platform, whatever the number of tests.
      - name: Build the application for the suite
        run: pnpm e2e:build

      # The code behind the `e2e` feature is not seen by the checks of CI,
      # which build without it. Once is enough: it is the same everywhere.
      - name: Check the test-only code of the application
        if: runner.os == 'Linux'
        env:
          TERMX_ALLOW_E2E: "1"
        run: |
          cargo clippy -p termx-desktop --all-targets --features e2e,tauri/custom-protocol --locked -- -D warnings
          cargo test -p termx-desktop --features e2e,tauri/custom-protocol --locked --lib e2e::

      # The `e2e` feature embeds a WebDriver server, which must never ship.
      # The application refuses to compile it (apps/desktop/src-tauri/src/lib.rs
      # and build.rs): this checks that it does, and for the expected reason,
      # since any other compile error would also make the build fail.
      - name: Check that a release build cannot include the test-only code
        if: runner.os == 'Linux'
        run: |
          expect_refusal() {
            local reason="$1"
            shift
            echo "::group::$* (expected to fail: $reason)"
            local output status=0
            output=$("$@" 2>&1) || status=$?
            echo "$output"
            echo "::endgroup::"
            if ((status == 0)); then
              echo "::error::'$*' succeeded: the e2e feature was compiled"
              return 1
            fi
            if ! grep -qF -- "$reason" <<<"$output"; then
              echo "::error::'$*' failed, but not with: $reason"
              return 1
            fi
            echo "Refused as expected: $*" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          # A release build, even when it is allowed explicitly.
          expect_refusal "cannot be enabled in a release build" \
            env TERMX_ALLOW_E2E=1 \
            cargo check --release -p termx-desktop --features e2e --locked
          # A build that inherits from `release`, with debug assertions on.
          expect_refusal "only for the builds of the end-to-end suite" \
            env TERMX_ALLOW_E2E=1 CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true \
            cargo check --release -p termx-desktop --features e2e --locked
          # A debug build that did not come from `pnpm e2e:build`, such as
          # `tauri build --debug --features e2e`.
          expect_refusal "only for the builds of the end-to-end suite" \
            env -u TERMX_ALLOW_E2E \
            cargo check -p termx-desktop --features e2e,tauri/custom-protocol --locked

      # A failed test is never run again. Only a start of the application
      # that lost the port of its WebDriver server to another process is,
      # at most once per run of the suite (see e2e/src/app.ts); a second one
      # fails the run, and every one is reported below.
      - name: Run the end-to-end suite
        env:
          REPEAT: ${{ inputs.repeat || 1 }}
        run: |
          launcher=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            launcher=(xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24")
          fi
          failed=0
          for ((run = 1; run <= REPEAT; run++)); do
            echo "::group::Run $run of $REPEAT"
            status=0
            "${launcher[@]}" pnpm e2e || status=$?
            if [[ -f e2e/artifacts/startup-retries.log ]]; then
              sed "s/^/run $run: /" e2e/artifacts/startup-retries.log >>e2e/startup-retries-all.log
            fi
            if ((status != 0)); then
              failed=$((failed + 1))
              # Keep what this run left behind: the next one starts over.
              if [[ -d e2e/artifacts ]]; then
                mv e2e/artifacts "e2e/artifacts-failed-run-$run"
              fi
            fi
            echo "::endgroup::"
          done
          echo "Failed runs: $failed of $REPEAT" | tee -a "$GITHUB_STEP_SUMMARY"
          ((failed == 0))

      # Each one is also an annotation of the run, so that it is seen even
      # when everything passed.
      - name: Report the starts of the application that were repeated
        if: always()
        run: |
          log=e2e/startup-retries-all.log
          count=0
          [[ -f "$log" ]] && count=$(wc -l <"$log")
          echo "Repeated starts of the application: $count" | tee -a "$GITHUB_STEP_SUMMARY"
          if ((count > 0)); then
            while IFS= read -r line; do
              echo "::warning title=Repeated start of the application::$line"
            done <"$log"
          fi

      # The logs of the application, what the terminal showed and a
      # screenshot for every failed test.
      - name: Upload what the failed tests left behind
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: e2e/artifacts*/
          if-no-files-found: ignore
          retention-days: 14

[package]
name = "termx-desktop"
description = "termx desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
# A distinct library name avoids an output file name clash with the binary on
# Windows.
name = "termx_desktop_lib"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
# Shows the log folder in the file manager of the platform.
open = "5.4.5"
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.12.7", features = [] }
termx-core = { workspace = true }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
